[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matching-engine"
version = "0.1.0"
description = "Matrix-based document matching engine with strategy pattern"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["nerds_nlp*"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
